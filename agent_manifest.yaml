apiVersion: aikart.dev/v1
kind: AgentManifest
metadata:
  name: sahayta
  displayName: "Sahayta - GovTech Citizen Action Agent"
  description: "Autonomous action-oriented GovTech AI Agent for Bharat: triages grievances across Union, State, and Municipal tiers, enforces zero-hallucination guardrails, drafts formal Article 350 petitions, and mints tamper-evident SHA-256 receipts."
runtime:
  type: docker
  image: "docker.io/officialdevangpatil/sahayta:1.0.0"
  command: ["python", "-m", "sahayta.aikart_runner"]
resources:
  cpu: 1
  memoryMb: 2048
  timeoutSeconds: 120
inputs:
  - name: complaint
    label: "Citizen Grievance Description (English / Hindi / Hinglish)"
    type: textarea
    required: true
  - name: language
    label: "Preferred Language"
    type: select
    required: false
    options: ["English", "Hindi", "Hinglish"]
    default: "English"
output:
  format: markdown
security:
  networkEgress: none

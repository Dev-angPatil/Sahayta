[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahayta"
version = "0.1.0"
description = "Action-Oriented GovTech AI Agent for Indian Civic Grievance Triage, Elicitation, Drafting & Submission"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dev-angPatil" }
]
keywords = [
    "govtech",
    "civic-tech",
    "agentic-ai",
    "bharat-agentic",
    "cpgrams",
    "public-distribution-system",
    "utilities",
    "anti-hallucination"
]
dependencies = [
    "pydantic>=2.7.0",
    "email-validator>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
sahayta = "sahayta.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sahayta*"]

[tool.setuptools.package-data]
"sahayta" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
